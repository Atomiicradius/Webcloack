<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
  </defs>
  <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="url(#cg)" stroke-width="3" filter="url(#g)"/>
  <polygon points="50,20 80,35 80,65 50,80 20,65 20,35" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="10" fill="#00f3ff" opacity="0.9" filter="url(#g)"/>
  <circle cx="50" cy="50" r="4" fill="#fff"/>
</svg>
